<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rick & Morty API</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Rick & Morty</h1>
    </header>

    <main>
        <section id="buttons-section">
            <button id="btn-get-all">Personajes</button>
        </section>

        <section id="filters-section">
            <form id="filter-form">
                <div class="filter-field">
                    <label for="filter-name">Nombre:</label>
                    <input type="text" id="filter-name" name="name" placeholder="Ej: Rick" />
                </div>
                <div class="filter-field">
                    <label for="filter-status">Estado:</label>
                    <input type="text" id="filter-status" name="status" placeholder="alive, dead, unknown" />
                </div>
                <div class="filter-field">
                    <label for="filter-species">Especie:</label>
                    <input type="text" id="filter-species" name="species" placeholder="Ej: Human" />
                </div>
                <div class="filter-field">
                    <label for="filter-type">Tipo:</label>
                    <input type="text" id="filter-type" name="type" placeholder="Ej: Parasite" />
                </div>
                <div class="filter-field">
                    <label for="filter-gender">Género:</label>
                    <input type="text" id="filter-gender" name="gender" placeholder="female, male, genderless, unknown" />
                </div>
                <button type="submit" id="btn-filter-submit">Buscar</button>
            </form>
        </section>

        <section id="output-section">
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
